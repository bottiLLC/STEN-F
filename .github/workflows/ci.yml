name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Set up Python
      run: |
        uv python install 3.14

    - name: Install dependencies
      run: |
        uv sync --all-groups

    - name: Lint with ruff
      run: |
        uv run ruff check app tests backup_manager.py app.py
        uv run ruff format --check app tests backup_manager.py app.py

    - name: Type check with mypy
      run: |
        uv run mypy app tests backup_manager.py
        uv run mypy app.py

    - name: Run tests with pytest
      env:
        PYTHONPATH: .:app
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        GEMINI_API_KEY: "dummy-key-for-ci"
      run: |
        uv run pytest -v -m "not fuzz" --cov=app --cov=backup_manager
