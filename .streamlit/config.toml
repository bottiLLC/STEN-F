[browser]
gatherUsageStats = false

[server]
headless = false
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
maxCacheDataSize = "1024mb"

[runner]
magicEnabled = false
connectionDefaultTTL = 300

[client]
showErrorDetails = "stacktrace"

[theme]
base = "light"
primaryColor = "#1E3A8A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F9FA"
textColor = "#1F2937"
font = "sans serif"
