[project]
name = "sten-f"
version = "1.1.0"
description = "STEN-F: Simple Tough Effective Next-generation Finance app"
authors = [
    {name = "Botti LLC", email = "botti@example.com"},
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.64.0",
    "sqlalchemy>=2.0.38",
    "aiosqlite>=0.21.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.0",
    "openai>=1.63.2",
    "structlog>=25.1.0",
    "aiofiles>=24.1.0",
    "reportlab>=4.3.1",
    "alembic>=1.14.1",
    "pandas>=3.0.1",
    "tenacity>=9.1.0",
    "pymupdf>=1.25.0",
    "google-genai>=2.22.0",
]


[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "mypy>=1.15.0",
    "ruff>=0.9.0",
    "hypothesis>=6.100.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --asyncio-mode=auto --cov=app --cov-branch --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = ["test_*.py", "*_test.py"]
pythonpath = [".", "app"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:google.genai.*",
    "ignore::RuntimeWarning:pytest_asyncio.*",
]
markers = [
    "fuzz: custom mark for hypothesis fuzz tests",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
files = ["app", "tests"]
